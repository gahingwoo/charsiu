# /etc/charsiu/config.ini: what `charsiu` runs, and how.
#
# Hand-editable. charsiu-config edits it IN PLACE: comments and any key it does
# not know about survive a round trip.

[model]
# The gguf to run. charsiu-get fetches one and puts it here.
# ⚠ charsiu reads f32 f16 q4_0 q4_1 q8_0 q6_K and builds ONLY a llama graph.
# `charsiu_check FILE` says whether a given file qualifies; the name does not.
path = /opt/charsiu/models/Llama-3.2-1B-Instruct-Q8_0.gguf

[run]
threads = 4
context = 512
# Which cores. RK3576 is 4x Cortex-A53 at 0-3 and 4x Cortex-A72 at 4-7.
# ⚠ MEASURED, round 379: pinning to the A53s costs 23% of tok/s (14.59 -> 11.17)
# and does NOT save energy. The little cores cannot feed the NPU, so the same
# bytes take longer to move and the NPU rail stays up for it. Leave this at 4-7.
cpus = 4-7

[npu]
enable = yes
# The K slice. ⚠ This writes BOTH CHARSIU_NPU_KMAX and CHARSIU_NPU_W4_GROUP,
# because npudev gates the int4 path on the two being EQUAL. One value here so
# they cannot drift apart.
kslice = 1024
# The widest output head that goes to the NPU, in rows.
#
# ⚠ THIS IS A VOCABULARY SIZE AND IT HAS TO CLEAR THE BIGGEST ONE. 131072 was
# picked to cover llama 3.2 (128256) and gemma3 is 262144, so gemma3 and gemma4
# fell off the end of it: the head stayed on the CPU where the stage table puts
# it at 44% of the token. The runtime clamps this to the model's own vocabulary,
# so a number bigger than the model costs nothing.
#
# Lower it to keep a wide head on the CPU. That was worth doing once -- the head
# used to share one output buffer with every other tensor, so its size was paid
# by all 113 matvecs a token -- and each tensor has had its own since round 366.
maxn = 262144
coef_elems = 65536

[debug]
# ⚠ OFF BY DEFAULT AND IT COSTS SOMETHING TO TURN ON. The stage timings take
# two clock reads a stage, about 5 us a token, which is enough to flatter or
# spoil a timing round that was not expecting them.
#
# On, every run prints where its time went, per stage, and `charsiu bench`
# also measures whether batching the projections pays on THIS machine --
# which is the number that decides whether a batched prefill is worth
# building, and it differs between a development host and the board.
enable = no

[extra]
# Raw CHARSIU_* passthrough, one NAME=VALUE per line, for the other hundred
# variables. Nothing here is validated. It is the escape hatch, not the door.

[update]
# stable or dev.
#
# ⚠ stable is the runtime, and the other modalities with it. dev adds the PROBES
# -- npu_gemm_test, charsiu_matmul, bench_batch, prefill_control.sh -- and
# tracks the branch the work happens on,
# where a register can be a literal that is wrong at every width but one for a
# fortnight. They are how the hardware gets asked questions, and asking has
# wedged the block more than once.
#
#   charsiu update dev      switch to it, and stay there
#   charsiu update stable   go back
channel = stable
